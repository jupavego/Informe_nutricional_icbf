<script>
const D = __DATOS__;
/* busca una de las reglas de depuracion por codigo (A1..H8); nunca
   falla: si no la encuentra devuelve ceros, para no romper una ficha */
const regla = cod => D.reglas.find(r => r.cod === cod) || { n: 0, pct: 0, desc: "" };

/* =====================================================================
   FICHAS TECNICAS — cada indicador con su definicion, los campos exactos
   del reporte descargado y su metodo de calculo. Nada aqui es inventado:
   todo se apoya en columnas que existen en ICBFCUEGeneralPorToma (71) y
   GestanteLactantePorToma (44).
   ===================================================================== */
const FICHAS = {

beneficiario:{t:"Beneficiario único",k:"Unidad de conteo",
 q:"Una niña o un niño distinto, contado una sola vez sin importar cuántas valoraciones tenga en el periodo.",
 c:"<code>Numero Documento Beneficiario</code> (columna 11)",
 m:()=>`NUMERADOR     valores distintos del documento
DENOMINADOR   no aplica: es un conteo, no una proporción
CÁLCULO       contar documentos sin repetir

ESTE CORTE    ${mil(D.meta.filas_nn)} filas de toma
              ÷ ${mil(D.meta.benef_nn)} documentos distintos
              = ${(D.meta.filas_nn/D.meta.benef_nn).toFixed(2).replace(".",",")} filas por niño`,
 v:()=>`<b>Este es el error más frecuente al leer el reporte.</b> Cada fila es una toma, no una persona. Contar filas infla la población un ${Math.round((D.meta.filas_nn/D.meta.benef_nn-1)*100)} %.`},

ultima_toma:{t:"Última toma",k:"Regla de deduplicación",
 q:"De todas las valoraciones de un mismo beneficiario, la más reciente del periodo. Es la que describe su estado actual.",
 c:"<code>Numero Documento Beneficiario</code> (11) + <code>Toma Mensual</code> (32)",
 m:()=>`PASO 1        agrupar todas las filas por documento
PASO 2        dentro de cada grupo, quedarse con la fila
              de mayor valor en Toma Mensual
PASO 3        si hay empate, la última leída

RESULTADO     ${mil(D.meta.benef_nn)} filas, una por beneficiario`,
 v:"Toda prevalencia de este tablero se calcula sobre la última toma. Las trayectorias y la cobertura sí recorren el histórico completo."},

toma:{t:"Toma mensual",k:"Dimensión de tiempo",
 q:"El número de la valoración dentro de la vigencia. Resultó ser, literalmente, el mes calendario.",
 c:"<code>Toma Mensual</code> (32) y <code>Fecha Valoración Nuricional</code> (20)",
 m:()=>`VERIFICACIÓN  se cruzó el número de toma contra el mes
              de la fecha de valoración, en las ${mil(D.meta.filas_nn)} filas

${D.historico.nn.meses.map((t,i)=>"              toma "+t+" → todas con fecha de "+D.historico.nn.etiquetas[i].toLowerCase()).join("\n")}

              sin una sola excepción`,
 v:"Los ciclos masivos son <b>febrero y mayo</b>. Comparar mes contra mes muestra caídas que no existen: la comparación válida es ciclo contra ciclo."},

vinculado:{t:"Estado del beneficiario",k:"Filtro de denominador",
 q:"Si la niña o el niño sigue activo en el servicio o ya salió.",
 c:"<code>Estado</code> (66). Valores: VINCULADO / DESVINCULADO",
 m:(a)=>`FILTRO        se conservan solo las filas con
              Estado = 'VINCULADO'

              se aplica ANTES de cualquier otro cálculo,
              porque cambia el denominador de todo

ESTE CORTE    ${mil(a.n)} beneficiarios vinculados
              en el conjunto filtrado`,
 v:()=>{
   const en = D.calidad_extra.estado_nn, eg = D.calidad_extra.estado_gs;
   const tn = Object.values(en).reduce((s,x)=>s+x,0), tg = Object.values(eg).reduce((s,x)=>s+x,0);
   const dn = pct(tn-(en.VINCULADO||0), tn), dg = pct(tg-(eg.VINCULADO||0), tg);
   return `En niñas y niños los desvinculados son el ${p1(dn)}; en gestantes el ${p1(dg)}. Sin este filtro la prevalencia se calcularía sobre población que ya salió del programa.`;
 }},

zscore:{t:"Puntaje Z",k:"Base de toda clasificación",
 q:"Cuántas desviaciones estándar separa al niño de la mediana de referencia de la OMS para su edad y sexo. Ver «Desviación estándar» y «Mediana» en este glosario para el concepto general.",
 c:"<code>ZScore Talla Edad</code> (50), <code>ZScore Peso Edad</code> (51), <code>ZScore Peso Talla</code> (52), <code>ZScore IMC</code> (53)",
 m:()=>{
   const z=D.calidad_extra.z, nom={z_te:"Talla/Edad",z_pe:"Peso/Edad",z_pt:"Peso/Talla",z_imc:"IMC"};
   const filas=["z_te","z_pe","z_pt","z_imc"].map(k=>{const r=z[k];
     return "  "+nom[k].padEnd(12)+(r.media==null?"sin dato":r.media.toFixed(2).replace(".",",").padEnd(8)+" media   "+r.mediana.toFixed(2).replace(".",",")+" mediana");}).join("\n");
   return `ENTRA         la medida cruda (peso o talla), la edad
              en meses y el sexo
SALE DE       las tablas LMS de los Patrones de
              Crecimiento Infantil de la OMS 2006
LO CALCULA    el sistema, no este tablero

ESTE CORTE, TODAS LAS TOMAS (${mil(D.meta.filas_nn)} filas)
${filas}

              Media y mediana casi iguales = distribución
              simétrica; si se separan, hay valores extremos
              jalando la media hacia un lado.`;
 },
 n:"Patrones de Crecimiento Infantil OMS 2006",
 v:"<b>Nunca se debe imputar un puntaje Z que falte.</b> Recalcularlo exige miles de valores de referencia por edad y sexo. Si falta, el registro queda como <i>no evaluable</i>."},

pt:{t:"Peso para la talla",k:"Indicador antropométrico",
 q:"Relaciona el peso con la talla alcanzada. Detecta la desnutrición aguda y el exceso de peso. Es el indicador de emergencia.",
 c:"<code>Estado Peso Talla</code> (57), derivado de <code>ZScore Peso Talla</code> (52)",
 m:()=>`PUNTOS DE CORTE de la Resolución 2465 de 2016

  Z < −3          Desnutrición aguda severa
  −3 ≤ Z < −2     Desnutrición aguda moderada
  −2 ≤ Z < −1     Riesgo de desnutrición aguda
  −1 ≤ Z ≤ +1     Peso adecuado para la talla
  +1 < Z ≤ +2     Riesgo de sobrepeso
  +2 < Z ≤ +3     Sobrepeso
  Z > +3          Obesidad

NOTA          «adecuado» es el intervalo CERRADO en
              los dos extremos: incluye −1 y +1`,
 n:"Resolución 2465 de 2016 · Ministerio de Salud",
 v:()=>{const d1=regla("D1");
   return `<b>Verificado:</b> se contrastó la clasificación del sistema contra el puntaje Z en las ${mil(D.meta.filas_nn)} filas. `
     +(d1.n===0?`<b>Cero discrepancias.</b> El sistema clasifica exactamente según la norma.`
               :`<b>${mil(d1.n)} discrepancias</b> (${p2(d1.pct)}). El sistema no siempre clasifica según la norma en este corte — revisar la regla D1 en Calidad del dato.`);
 }},

te:{t:"Talla para la edad",k:"Indicador antropométrico",
 q:"Compara la talla con la esperada para la edad. Detecta la desnutrición crónica, que refleja privación sostenida y no un episodio reciente.",
 c:"<code>Estado Talla Edad</code> (55), derivado de <code>ZScore Talla Edad</code> (50)",
 m:()=>`PUNTOS DE CORTE de la Resolución 2465 de 2016

  Z < −2          Retraso en talla
  −2 ≤ Z < −1     Riesgo de talla baja
  Z ≥ −1          Talla adecuada para la edad

LA NORMA      distingue además retraso severo (Z < −3).
DISTINGUE     El sistema no lo separa, pero el tablero
              lo recalcula desde el puntaje Z para el
              componente antropométrico del índice.`,
 n:"Resolución 2465 de 2016",
 v:"Ojo con la medida de origen: en menores de dos años es <b>longitud</b> tomada acostado con infantómetro, y desde los dos años es <b>talla</b> tomada de pie con tallímetro. Son técnicas distintas y eso se nota en el dato."},

pe:{t:"Peso para la edad",k:"Indicador antropométrico",
 q:"Indicador combinado: un niño puede tener peso bajo para la edad por delgadez, por talla baja o por ambas.",
 c:"<code>Estado Peso Edad</code> (56), derivado de <code>ZScore Peso Edad</code> (51)",
 m:()=>`PUNTOS DE CORTE de la Resolución 2465 de 2016

  Z < −2          Desnutrición global
  −2 ≤ Z < −1     Riesgo de peso bajo para la edad
  Z ≥ −1          Peso adecuado para la edad
  Z > +1          No Aplica`,
 n:"Resolución 2465 de 2016",
 v:"El valor <b>«No Aplica»</b> no es un error: la norma no define categorías de exceso para peso/edad en menores de cinco años, porque el exceso se valora con peso/talla e IMC. Graficarlo como si fuera un estado nutricional es un error de lectura."},

dnt_aguda:{t:"Desnutrición aguda moderada o severa",k:"Indicador de emergencia",
 q:"Niñas y niños con déficit agudo de peso frente a su talla. Requieren atención inmediata del sector salud.",
 c:"<code>Estado Peso Talla</code> (57)",
 m:(a)=>`NUMERADOR     beneficiarios únicos cuya última toma
              clasifica como 'Desnutricion Aguda Moderada'
              o 'Desnutricion aguda severa'
DENOMINADOR   beneficiarios únicos vinculados del
              conjunto filtrado
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.dnt)} ÷ ${mil(a.n)}
              = ${p2f(pct(a.dnt,a.n))}
              de los cuales ${mil(a.pt[1])} son severos`,
 n:"Resolución 2465 de 2016 · Resolución 3280 de 2018",
 v:"Es una lista corta, nominal y verificable uno por uno. Está en la pestaña <b>Ruta crítica</b>."},

retraso:{t:"Retraso en talla",k:"Desnutrición crónica",
 q:"Talla por debajo de dos desviaciones estándar de la esperada para su edad y sexo.",
 c:"<code>Estado Talla Edad</code> (55) — equivale a <code>ZScore Talla Edad</code> &lt; −2",
 m:(a)=>`NUMERADOR     beneficiarios únicos cuya última toma
              clasifica como 'Retraso en talla'
DENOMINADOR   beneficiarios únicos vinculados del
              conjunto filtrado, con clasificación válida
              de talla para la edad
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.retraso)} ÷ ${mil(a.n)}
              = ${p2f(pct(a.retraso,a.n))}

NO SE INCLUYE 'Riesgo de talla baja' (Z entre −2 y −1),
              que es la categoría anterior y agrupa a
              ${mil(a.te[2])} beneficiarios más`,
 n:"Resolución 2465 de 2016",
 v:"Es el problema de mayor magnitud de la regional. No genera alarma operativa porque no exige canalización inmediata, pero es el que describe el territorio."},

exceso:{t:"Sobrepeso y obesidad",k:"Malnutrición por exceso",
 q:"Peso por encima de dos desviaciones estándar frente a la talla alcanzada.",
 c:"<code>Estado Peso Talla</code> (57)",
 m:(a)=>`NUMERADOR     beneficiarios únicos clasificados como
              'Sobrepeso' (Z entre +2 y +3)
              u 'Obesidad' (Z mayor que +3)
DENOMINADOR   beneficiarios únicos vinculados
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.pt[6])} sobrepeso + ${mil(a.pt[7])} obesidad
              = ${mil(a.exceso)} ÷ ${mil(a.n)}
              = ${p2f(pct(a.exceso,a.n))}

NO SE INCLUYE 'Riesgo de sobrepeso' (Z entre +1 y +2),
              que suma ${mil(a.pt[5])} beneficiarios más`,
 n:"Resolución 2465 de 2016",
 v:"El flujo entre tomas se mueve hacia este lado: más beneficiarios pasan de adecuado a riesgo de sobrepeso que al revés."},

cobertura:{t:"Cobertura de toma (cupos UDS)",k:"Indicador de gestión",
 q:"Qué proporción del cupo autorizado de cada unidad de servicio (UDS) tuvo beneficiarios únicos con una toma nutricional durante el último trimestre completo. Mide si la oferta contratada se está usando, no la salud del beneficiario.",
 c:"<code>Cupos UDS</code> y <code>Estado de la UDS</code> (reporte de Unidades de Servicio, solo unidades ACTIVAS), cruzados por <code>Código UDS</code> con <code>Toma Mensual</code> (32) y <code>Estado</code> (66) del reporte nutricional",
 m:()=>{
   const t=D.meta.uds_trimestre, con=(D.uds||[]).filter(u=>u.cu!=null);
   const cu=con.reduce((s,u)=>s+u.cu,0), bt=con.reduce((s,u)=>s+(u.bt||0),0);
   return `NUMERADOR     beneficiarios vinculados ÚNICOS con una
              toma registrada en el trimestre
              ${t?t.lbl:"más reciente completo"}
DENOMINADOR   cupos autorizados de esa UDS (reporte de
              Unidades de Servicio, solo unidades ACTIVAS)
CÁLCULO       numerador ÷ denominador × 100 por UDS; el
              mapa suma numerador y denominador por
              municipio o centro zonal antes de dividir

ESTE CORTE    ${mil(bt)} ÷ ${mil(cu)} = ${p2f(pct(bt,cu))}
              (${con.length} de ${(D.uds||[]).length} UDS
              con cupo conocido)

POR QUÉ POR   una toma por trimestre es lo que exige el
TRIMESTRE     lineamiento. Medir mes a mes penaliza a quien
              sí cumple, solo que en otro mes del mismo
              trimestre; y usar el historial completo
              premiaría para siempre a quien tomó una vez.`;
 },
 v:"Las UDS sin cupo conocido en el reporte de Unidades de Servicio quedan afuera del cálculo: ni suman beneficiarios ni cupos, para no inflar ni desinflar el porcentaje del territorio."},

criterio:{t:"Criterio de cumplimiento de nutrición",k:"Indicador del sistema",
 q:"Marca del propio sistema sobre si el registro nutricional del beneficiario cumple lo exigido.",
 c:"<code>Criterio de cumplimiento de nutrición</code> (71). Valores: CUMPLE / NO CUMPLE",
 m:(a)=>`ORIGEN        lo calcula el sistema Cuéntame.
              Este tablero NO lo recalcula: lo lee
              tal como viene en la columna 71.

NUMERADOR     beneficiarios con valor 'NO CUMPLE'
DENOMINADOR   beneficiarios vinculados
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.nc)} ÷ ${mil(a.n)}
              = ${p2f(pct(a.nc,a.n))}`,
 v:()=>{
   const g=porDim(idxNN(),"cz",DIC.cz,300).map(x=>pct(x.r.nc,x.r.n)).filter(v=>v>0);
   const veces=g.length>1?(Math.max(...g)/Math.min(...g)):1;
   return `<b>Mide gestión, no nutrición.</b> Su dispersión entre centros zonales de la misma regional llega a ser de ${veces.toFixed(1).replace(".",",")} veces (mínimo 300 beneficiarios por centro zonal), y ninguna diferencia nutricional real explica eso. Lo que mide es disciplina de registro.`;
 }},

canalizacion:{t:"Canalización a salud",k:"Respuesta institucional",
 q:"Si el caso de desnutrición aguda fue remitido a la entidad territorial de salud o a la EAPB.",
 c:"Columna 69: «Si el niño o niña presenta desnutrición aguda moderada o severa, ¿fue canalizado…?»",
 m:(a)=>`APLICA A      SOLO los beneficiarios cuyo Estado Peso
              Talla indica desnutrición aguda moderada
              o severa. En los demás el valor esperado
              es 'No Tiene Desnutrición Aguda'.

NUMERADOR     de esos casos, los que tienen valor 'SI'
DENOMINADOR   total de casos de desnutrición aguda
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.canal)} ÷ ${mil(a.dnt)}
              = ${a.dnt?p2f(pct(a.canal,a.dnt)):"—"}`,
 n:"Resolución 3280 de 2018 · Rutas Integrales de Atención en Salud",
 v:"<b>Cuidado al construir este indicador.</b> Decenas de miles de filas traen 'NO' en niños que NO tienen desnutrición aguda: el diligenciamiento correcto era 'No Tiene Desnutrición Aguda'. Sin condicionar la regla al diagnóstico, el tablero reporta falsos «sin canalizar»."},

ftlc:{t:"Fórmula Terapéutica Lista para el Consumo",k:"Tratamiento",
 q:"Si el niño con desnutrición aguda está recibiendo FTLC por el sector salud.",
 c:"Columna 70",
 m:(a)=>`APLICA A      solo los casos de desnutrición aguda
              moderada o severa

NUMERADOR     de esos casos, los que tienen valor 'SI'
DENOMINADOR   total de casos de desnutrición aguda
CÁLCULO       numerador ÷ denominador × 100

ESTE CORTE    ${mil(a.ftlcSi)} ÷ ${mil(a.dnt)}
              = ${a.dnt?p2f(pct(a.ftlcSi,a.dnt)):"—"}`,
 v:()=>{
   let sinDato=0, dnt=0;
   for (const i of idxNN()) if (N.pt[i]===1||N.pt[i]===2) { dnt++; if (N.ftlc[i]===0) sinDato++; }
   return `Es el campo peor diligenciado del reporte: solo el ${p1(100-pct(sinDato,dnt))} de los casos de desnutrición aguda trae algún valor (SI o NO).`;
 }},

flag:{t:"Flag de plausibilidad OMS",k:"Control de calidad",
 q:"Marca que el propio sistema pone cuando una medición cae fuera de los límites biológicamente posibles.",
 c:"<code>Flag</code> (54). Cero = sin problema; distinto de cero = medición implausible",
 m:()=>{const f=D.calidad_extra.flag, okD=f.ok_dentro||0, okF=f.ok_fuera||0, malD=f.mal_dentro||0, malF=f.mal_fuera||0;
   return `VERIFICACIÓN  se contrastó el Flag contra los límites
              OMS de los 4 puntajes Z, en las ${mil(D.meta.filas_nn)} filas

              Flag = 0  → ${p1(pct(okD,okD+okF))} dentro de los límites
              Flag ≠ 0  → ${p1(pct(malF,malD+malF))} fuera de los límites

USO EN ESTE   los registros con Flag 2 a 7 se excluyen
TABLERO       del índice de riesgo y quedan marcados como
              NO EVALUABLE, en vez de contaminar el
              promedio de su operador. El Flag 1 SE
              EVALÚA (no se excluye): la Guía ICBF
              (Tabla 13) aclara que en servicios de
              nutrición es posible encontrar casos reales
              de muy bajo peso para la talla y talla muy
              baja para la edad`;
 },
 n:"Límites de plausibilidad de la OMS · Guía ICBF G44.PP v1, Tabla 13",
 v:"<b>Es un control que ya existe y antes no se aprovechaba del todo.</b> Un puntaje Z fuera de estos límites es biológicamente imposible: sin filtrar, ese registro puede entrar como obesidad severa o desnutrición severa cuando en realidad es un error de digitación. El Flag 1 es la excepción: la Guía ICBF pide mantenerlo evaluable."},

talla_inf:{t:"Talla inferior a la última toma",k:"Control de calidad",
 q:"Marca del sistema cuando la talla medida es menor que la de la valoración anterior. Un niño no encoge.",
 c:"<code>Talla inferior última toma</code> (68). Valores: SI / NO",
 m:()=>{const c8=regla("C8"), c6=regla("C6");
   return `ORIGEN        lo marca el sistema comparando contra
              su propio histórico, que va más atrás
              que el periodo descargado

EN EL CORTE   ${mil(c8.n)} registros marcados con 'SI'
              = ${p2(c8.pct)} de las filas

REGLA PROPIA  el tablero además calcula su versión
DEL TABLERO   dentro del periodo (regla C6, autoría propia)
              y encuentra ${mil(c6.n)}: no coincide exactamente
              con lo anterior porque el sistema compara contra
              todo el histórico y el tablero solo contra
              las tomas de este corte (${D.meta.periodo}).
              C6 hoy solo mira si la talla BAJÓ; la Guía
              (Tabla 11) además exige un ritmo de crecimiento
              esperado por trimestre según la edad (≈4 cm/
              trimestre en menores de 2 años, ≈2 cm/trimestre
              de 2 a 5 años) — esa versión completa aún no
              está implementada, C6 es un proxy más simple

USO EN ESTE   la Guía ICBF (Tablas 13 y 14) pide depurar
TABLERO       (excluir) toda toma marcada 'SI': el tablero
              la excluye de prevalencias, Semáforo e
              IRN/IRG y la deja como NO EVALUABLE`;
 },
 n:"Guía ICBF G44.PP v1, Tablas 13 y 14",
 v:"Un niño no encoge: por eso, siguiendo la Guía ICBF, esta marca ya no solo se cruza contra C6 — excluye la toma del análisis. Sigue siendo el mejor indicador disponible de calidad de la medición por unidad de servicio."},

evolucion:{t:"Evolución entre tomas",k:"Tendencia",
 q:"Si el beneficiario se acercó o se alejó de la adecuación entre su primera y su última valoración del periodo.",
 c:"<code>Estado Peso Talla</code> (57) de la toma de menor número contra la de mayor número, por documento",
 m:(a)=>`ESCALA        distancia a la adecuación. Los dos
              extremos son malos, así que no sirve
              una escala lineal de bueno a malo:

  0  Peso adecuado para la talla
  1  Riesgo de desnutrición · Riesgo de sobrepeso
  2  Desnutrición aguda moderada · Sobrepeso
  3  Desnutrición aguda severa · Obesidad

CÁLCULO       distancia(última) − distancia(primera)
              menor que cero → MEJORA
              igual a cero   → SE MANTIENE

/* =====================================================================
   CONCEPTOS ESTADISTICOS — el tablero usa media, mediana, percentiles,
   desviacion estandar e indices ponderados en varias partes (Perfil,
   curva de crecimiento, IRN/IRG/IDO). Estas cinco fichas explican el
   concepto una sola vez, para no repetirlo en cada indicador que lo usa.
   ===================================================================== */
media:{t:"Media (promedio)",k:"Concepto estadístico",
 q:"La suma de todos los valores dividida entre cuántos son. Es sensible a los valores extremos: uno solo muy alto o muy bajo puede desplazarla.",
 c:"Se usa como línea de referencia en los gráficos de puntos y de bala (Operadores, Estado nutricional por tramo de edad).",
 m:()=>`CÁLCULO       (x1 + x2 + ... + xn) ÷ n

DÓNDE APARECE la línea punteada de "media del conjunto"
              en los gráficos de puntos, y el punto medio
              de los gráficos de bala (Operadores)

CUIDADO       un solo territorio con un dato extremo puede
              mover la media sin que el resto haya cambiado.
              Por eso el tablero también reporta la mediana
              donde importa (Perfil, curva de crecimiento)`,
 v:"En este tablero la media casi siempre se calcula PONDERADA por la población de cada grupo, no como el promedio simple de los porcentajes de cada territorio: un centro zonal de 200 niños no pesa lo mismo que uno de 20.000."},

mediana:{t:"Mediana",k:"Concepto estadístico",
 q:"El valor que queda exactamente en la mitad cuando se ordenan todos los datos de menor a mayor: la mitad de las personas están por debajo, la mitad por encima.",
 c:"Aparece en Perfil (peso, talla, edad, semanas de gestación) y en la curva de crecimiento (mediana del puntaje Z por territorio).",
 m:()=>{const z=D.calidad_extra.z.z_pt, f=v=>v==null?"—":v.toFixed(2).replace(".",",");
   return `CÁLCULO       ordenar todos los valores y tomar el
              del medio (o el promedio de los dos del medio,
              si son una cantidad par)

VENTAJA       a diferencia de la media, no la mueve un valor
              extremo: si un peso quedara mal digitado como
              80 kg, la mediana casi ni se movería; la media sí

ESTE CORTE    puntaje Z peso/talla — media ${f(z.media)}
              frente a mediana ${f(z.mediana)}
              (ver la ficha «Puntaje Z» para las otras tres)`;
 },
 v:"Si la media y la mediana de un mismo indicador se parecen, la distribución es simétrica. Si se alejan, hay valores extremos jalando la media hacia un lado — con las medidas antropométricas, casi siempre hacia arriba, porque un error de digitación tiende a inflar el valor, no a reducirlo."},

 c:"Aparece en Perfil, en el bloque de cada medida cruda: mediana y rango intercuartílico.",

desviacion_estandar:{t:"Desviación estándar",k:"Concepto estadístico",
 q:"Qué tan dispersos están los datos alrededor de la media. Una desviación estándar pequeña significa que casi todos los valores están cerca de la media; una grande, que están repartidos.",
 c:"Es la unidad del puntaje Z (ver esa ficha): un puntaje Z de −2 significa «dos desviaciones estándar por debajo de la mediana de referencia».",
 m:()=>`INTUICIÓN     en una distribución normal (de campana), el
              68 % de los datos cae dentro de ±1 desviación
              estándar de la media, el 95 % dentro de ±2, y

POR ESO       la Resolución 2465 usa ±2 DE como punto de

indice_ponderado:{t:"Índice compuesto ponderado",k:"Concepto estadístico",
 q:"Un solo número de 0 a 100 que combina varios componentes, cada uno con un peso (%) fijo que refleja cuánto debería importar frente a los demás.",
 c:"Es el método detrás del IRN, el IRG y el IDO (ver sus fichas): cada uno pondera componentes distintos con la misma lógica.",
 m:()=>`FÓRMULA GENERAL
  índice = peso1·componente1 + peso2·componente2 + ...
  con los pesos sumando 100 %

SI UN COMPONENTE   su peso se reparte proporcionalmente
NO APLICA          entre los demás, para que el índice
                   siga sumando 100 % de peso disponible
                   (ver ficha IRN, caso "una sola toma")

PISO CLÍNICO       en el IRN y el IRG, algunos hallazgos

de la fórmula)     fijan una clase mínima SIN IMPORTAR el

                   dentro de cada clase; el piso clínico

 v:"Ponderar no es promediar: el componente antropométrico del IRN pesa 65 % porque es lo que de verdad importa clínicamente. Los demás (tendencia y factores asociados) ayudan a ordenar prioridades dentro de un mismo nivel de riesgo, pero no lo definen. <b>El IRN, el IRG y el IDO, con estos pesos y estos tramos de 0 a 100, son autoría propia de este tablero: no están en la Guía ICBF ni en la Resolución 2465.</b> Se construyen SOBRE clasificaciones que sí son oficiales (Estado Peso/Talla, Estado Talla/Edad, Flag, Resolución 2465) para poder priorizar, pero el índice compuesto en sí es un diseño del equipo — no un instrumento normativo del ICBF."},
};

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const mil = n => (n == null ? "–" : Math.round(n).toLocaleString("es-CO"));
const pct = (a, b) => b ? (100 * a / b) : 0;
const p1 = v => v.toFixed(1).replace(".", ",") + " %";
const p2 = v => v.toFixed(2).replace(".", ",") + " %";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- ficha tecnica ----------
   Se reutiliza para el Glosario (FICHAS) y para Fuentes de referencia
   (FUENTES): mismo modal, mismo formato dt/dd, solo cambian las
   etiquetas de cada campo -- "Que mide" no tiene sentido para un
   archivo de origen, ahi se lee "Que aporta". */
const modal = $("#modal");
const ETQ_DEFECTO = { q: "Qué mide", c: "Campos del reporte", m: "Método de cálculo",
  n: "Referencia normativa", v: "Nota de lectura" };
function ficha(key, dict, etq) {
  const f = (dict || FICHAS)[key]; if (!f) return;
  const L = etq || ETQ_DEFECTO;
  const b = el("div", "fx-inner");
  const hd = el("div", "hd");
  hd.innerHTML = `<div class="k">${esc(f.k)}</div><h3 id="fxtit">${esc(f.t)}</h3>`;
  const x = el("button", "close", "&times;"); x.setAttribute("aria-label", "Cerrar"); x.onclick = cerrar;
  hd.append(x);
  const bd = el("div", "bd");
  const dl = el("dl");
  const put = (t, h) => { dl.append(el("dt", null, t), el("dd", null, h)); };
  put(L.q, esc(f.q));
  put(L.c, f.c);
  const met = typeof f.m === "function" ? f.m(resumen(idxNN()), resumenGS(idxGS())) : f.m;
  dl.append(el("dt", null, L.m), (() => { const d = el("dd"); d.append(el("div", "fml", esc(met))); return d; })());
  if (f.n) put(L.n, `<span class="norm">${esc(f.n)}</span>`);
  const nota = typeof f.v === "function" ? f.v(resumen(idxNN()), resumenGS(idxGS())) : f.v;
  if (nota) put(L.v, nota.replace(/\n/g, "<br>"));
  bd.append(dl);
  $("#fx").textContent = ""; $("#fx").classList.remove("ancha");
  $("#fx").append(hd, bd);
  modal.classList.add("on");
  x.focus();
}
function cerrar() { modal.classList.remove("on"); }
modal.onclick = e => { if (e.target === modal) cerrar(); };
addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

function btnInfo(key) {
  const b = el("button", "info", "cómo se calcula");
  b.type = "button";
  b.setAttribute("aria-label", "Ficha técnica: " + (FICHAS[key] ? FICHAS[key].t : key));
  b.onclick = () => ficha(key);
  return b;
}
function h2(txt, key) { const h = el("h2", null, esc(txt)); if (key) h.append(btnInfo(key)); return h; }

/* ---------- tooltip ---------- */
const tt = $("#tt");
function showTT(e, html) {
  tt.innerHTML = html; tt.style.opacity = "1";
  const r = tt.getBoundingClientRect();
  let x = e.clientX + 15, y = e.clientY + 15;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}
const hideTT = () => { tt.style.opacity = "0"; };
addEventListener("scroll", hideTT, true);
